descrizione: >-
  Dal corpo di marmo brecciato spuntano gemme di piombo fuso: l'innesto di un materiale tecnologico
  nella pietra, tema centrale della ricerca dell'artista a metà degli anni Ottanta. L'opera è stata
  esposta nel 1983 alla mostra «Intimità dell'indagine» a Palazzo dei Diamanti di Ferrara.
descrizione_en: >-
  Buds of cast lead sprout from the body of brecciated marble: the grafting of a technological
  material onto stone, a central theme of the artist's research in the mid-1980s. The work was shown
  in 1983 in the exhibition "Intimità dell'indagine" at Palazzo dei Diamanti in Ferrara.
