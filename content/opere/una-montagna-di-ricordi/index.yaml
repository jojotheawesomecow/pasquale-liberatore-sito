descrizione: >-
  Una montagna di segni scuri custodisce forme bianche dal contorno rosso: semi, volti, corpi,
  frutti. La grafica raccoglie in un'unica immagine il repertorio di forme organiche dell'artista.
descrizione_en: >-
  A mountain of dark marks holds white shapes outlined in red: seeds, faces, bodies, fruits. The
  print gathers the artist's repertoire of organic forms into a single image.
