descrizione: >-
  Un masso di pietra di Fanano si apre in due e rivela una figura seduta, a occhi chiusi, con una
  ciotola tra le mani. L'opera è stata realizzata durante il XV Simposio Internazionale di Scultura
  su Pietra di Fanano, sull'Appennino modenese.
descrizione_en: >-
  A boulder of Fanano stone splits open to reveal a seated figure, eyes closed, holding a bowl in
  its hands. The work was made during the 15th International Stone Sculpture Symposium of Fanano, in
  the Modena Apennines.
