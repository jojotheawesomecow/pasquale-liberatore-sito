descrizione: >-
  Alla fine degli anni Ottanta l'artista rivolge la ricerca al legno, lavorato in senso strutturale
  e segnico attraverso tagli e combustioni. Il fuoco disegna sulla superficie una geometria di
  ombre.
descrizione_en: >-
  In the late 1980s the artist turned his research to wood, worked structurally and as a sign
  through cuts and burning. Fire draws a geometry of shadows on the surface.
