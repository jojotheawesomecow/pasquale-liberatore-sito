descrizione: >-
  Uno dei primi germogli ingigantiti dell'artista: la superficie lavorata a gradina trattiene la
  luce come una buccia, mentre le punte lisce in alto annunciano l'apertura. Un tema che ritornerà
  quarant'anni dopo nel «Germoglio» in ardesia del 2021.
descrizione_en: >-
  One of the artist's first enlarged sprouts: the surface, worked with a claw chisel, holds the
  light like a skin, while the smooth tips at the top announce the opening. A theme that would
  return forty years later in the slate "Sprout" of 2021.
