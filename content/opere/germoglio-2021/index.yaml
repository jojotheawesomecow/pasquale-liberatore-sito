descrizione: >-
  Un germoglio di ardesia nera si innesta su una base di marmo bianco di Carrara: due materie e due
  tempi geologici in un'unica spinta verso l'alto. L'opera è fotografata sui prati d'alta quota,
  davanti alle montagne abruzzesi che sono da sempre il paesaggio interiore dell'artista.
descrizione_en: >-
  A sprout of black slate grafted onto a base of white Carrara marble: two materials and two
  geological times in a single upward thrust. The work is photographed on high mountain meadows, in
  front of the Abruzzo peaks that have always been the artist's inner landscape.
