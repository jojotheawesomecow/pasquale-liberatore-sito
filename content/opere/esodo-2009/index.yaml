descrizione: >-
  Una piccola folla di figure in cammino, scolpite in un unico blocco di pietra Perla d'Abruzzo. È
  il primo «Esodo»: sei anni dopo il tema tornerà, in grande, sulla scogliera di San Benedetto del
  Tronto.
descrizione_en: >-
  A small crowd of walking figures carved from a single block of Abruzzo Perla stone. It is the
  first "Exodus": six years later the theme would return, on a large scale, on the breakwater of San
  Benedetto del Tronto.
