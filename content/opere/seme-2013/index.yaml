descrizione: >-
  Un grande seme in pietra bianca della Majella, alto un metro e sessanta, realizzato durante la
  manifestazione «Dieci giornate in pietra» di Lettomanoppello, paese di cavatori e scalpellini alle
  pendici della Majella. Le pieghe della superficie ricordano insieme un frutto, un cervello e un
  corpo raccolto.
descrizione_en: >-
  A large seed in white Majella stone, one metre sixty tall, made during the "Ten Days in Stone"
  event in Lettomanoppello, a village of quarrymen and stonecutters on the slopes of the Majella.
  The folds of the surface recall at once a fruit, a brain and a body curled up on itself.
