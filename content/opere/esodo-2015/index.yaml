collezione: «Scultura Viva», scogliera del molo sud
foto: /media/opere/esodo-2015/esodo-2015.jpg
galleria: []
descrizione: >-
  Una fila di figure emerge dai blocchi di travertino della scogliera, rivolta verso il mare.
  L'opera fa parte del percorso di sculture a cielo aperto «Scultura Viva» sul molo di San Benedetto
  del Tronto, dove la pietra è scolpita direttamente sui massi della diga.
descrizione_en: >-
  A line of figures emerges from the travertine blocks of the breakwater, facing the sea. The work
  is part of the open-air sculpture trail "Scultura Viva" on the pier of San Benedetto del Tronto,
  where the stone is carved directly into the boulders of the dam.
