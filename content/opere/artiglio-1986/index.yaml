descrizione: >-
  Una colonna alta quattro metri in arenaria serena, con la base che si radica nel prato come un
  artiglio o una zampa. Fa parte del «Campo del Sole» di Tuoro sul Trasimeno, un parco di
  sculture-colonne realizzate tra il 1985 e il 1989 da artisti di diversi paesi sulle rive del lago.
descrizione_en: >-
  A four-metre column in serena sandstone, its base rooted in the lawn like a claw or a paw. It is
  part of the "Campo del Sole" in Tuoro sul Trasimeno, a park of sculpture-columns made between 1985
  and 1989 by artists from several countries on the shores of the lake.
