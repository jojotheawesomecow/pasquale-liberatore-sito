descrizione: >-
  Le venature del marmo attraversano la superficie chiusa del seme come i vasi di un organismo vivo.
  È una delle forme embrionali che l'artista indaga da cinquant'anni: un corpo raccolto su se
  stesso, in attesa di germinare.
descrizione_en: >-
  The veins of the marble run across the closed surface of the seed like the vessels of a living
  organism. It is one of the embryonic forms the artist has investigated for fifty years: a body
  gathered into itself, waiting to germinate.
