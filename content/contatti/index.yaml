it: >-
  Pubblico la maggior parte dei miei pensieri sul mio account Instagram. Ma se vuoi, puoi spedirmi un
  messaggio da qui, così possiamo farci una chiacchierata.
en: >-
  I publish most of my thoughts on my Instagram account. But if you like, you can send me a message
  from here, so we can have a chat.
