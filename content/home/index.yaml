immagine_didascalia: Germoglio, 2021. Ardesia e marmo bianco di Carrara, 60×35×15 cm
titolo: Sono uno scultore, un pittore, un artista.
titolo_en: I am a sculptor, a painter, an artist.
testo: >-
  Studio il mondo e la natura nella mia casa e nel mio giardino a Villa Sant'Angelo, in Abruzzo.
testo_en: >-
  I study the world and nature in my home and in my garden in Villa Sant'Angelo, Abruzzo.
presentazione: >-
  Nato nel 1950 a San Demetrio ne' Vestini, dal 1977 docente di Tecnologia ed uso del marmo e della
  pietra all'Accademia di Belle Arti dell'Aquila, Pasquale Liberatore lavora da cinquant'anni sulle
  forme chiuse ed embrionali che generano vita: semi, tuberi, germogli. Pietra della Majella, marmo,
  ardesia, legno e resina diventano corpi che raccontano il legame tra l'uomo e il suo territorio.
presentazione_en: >-
  Born in 1950 in San Demetrio ne' Vestini and, from 1977, professor of Technology and Use of Marble
  and Stone at the Academy of Fine Arts of L'Aquila, Pasquale Liberatore has spent fifty years working
  on the closed, embryonic forms that generate life: seeds, tubers, sprouts. Majella stone, marble,
  slate, wood and resin become bodies that tell of the bond between people and their land.
citazione: >-
  In una macchia si può cercare l'universo. In una pozzanghera il mare. Una formica vale in termini
  evoluzionistici quanto un elefante.
citazione_en: >-
  In a stain one can look for the universe. In a puddle, the sea. In evolutionary terms an ant is
  worth as much as an elephant.
citazione_fonte: I semi sono il territorio
